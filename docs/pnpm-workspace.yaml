packages:
  - .

# Without it docs/node_modules holds only direct dependencies, Node walks up to the root
# node_modules, and the server bundle can get a second copy of Vue.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@agntn/*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
