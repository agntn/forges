packages:
  - docs

gitChecks: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# One version per name for the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/credentials": 0.0.2
    "@agntn/hashes": 0.7.2
    "@agntn/tools": 0.2.4
    "@modelcontextprotocol/server": 2.2.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    forges: 0.2.0
    h3: 1.15.11
    nitropack: 2.13.4
    nuxt: 4.6.2
    ohash: 2.0.12
    ufo: 1.6.4
    unstorage: 1.17.6
  dev:
    "@earendil-works/pi-coding-agent": 1.0.4
    "@earendil-works/pi-tui": 1.0.4
    "@iconify-json/lucide": 1.2.147
    "@iconify-json/simple-icons": 1.2.100
    "@iconify-json/vscode-icons": 1.2.92
    "@modelcontextprotocol/client": 2.2.0
    "@nuxt/content": 3.16.2
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/omptype": 18.4.12
    "@oh-my-pi/pi-coding-agent": 18.4.12
    "@types/node": 24.11.2
    "@vueuse/core": 15.0.0
    jiti: 2.7.0
    obuild: 0.4.45
    shiki: 4.5.0
    typebox: 1.3.37
    typescript: 5.9.3
    wrangler: 4.128.0

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - "@agntn/*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
